version: 2

project_name: mdmirror

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: mdmirror
    main: ./cmd/mdmirror
    binary: mdmirror
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: mdmirror
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: JeetChauhan17
    name: mdmirror
  draft: true
  prerelease: auto
